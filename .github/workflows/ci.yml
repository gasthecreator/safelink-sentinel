name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the comment) so a moved tag can't
# change what runs. Update them deliberately.
env:
  NODE_VERSION: "20"

jobs:
  app-js:
    name: App - tests and JS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit tests (codec, framing, crypto, relay simulation)
        working-directory: app
        run: npx jest --ci
      # Bundling both platforms catches broken imports and unresolved modules,
      # which is how most past breakages showed up.
      - name: Bundle Android JS
        working-directory: app
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output "$RUNNER_TEMP/android.bundle" --assets-dest "$RUNNER_TEMP/android-assets"
      - name: Bundle iOS JS
        working-directory: app
        run: npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output "$RUNNER_TEMP/ios.bundle" --assets-dest "$RUNNER_TEMP/ios-assets"

  dashboard:
    name: Dashboard - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w safelink-dashboard

  server:
    name: Server - syntax check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: node --check every server source file
        run: git ls-files 'server/*.js' | xargs -n1 node --check
      # Security headers, CORS, rate limits, admin gate, input validation (runs the real app on a random port).
      - name: Server tests
        run: npm test --prefix server

  android:
    name: Android - release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      # gradle.properties pins org.gradle.java.home to a Homebrew path on the
      # maintainer's Mac; the command-line property overrides it here.
      - name: Assemble release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  ios:
    name: iOS - simulator build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install pods
        working-directory: app/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pod install
      - name: Build for the simulator
        working-directory: app/ios
        run: >
          xcodebuild
          -workspace SafeLinkMesh.xcworkspace
          -scheme SafeLinkMesh
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build
