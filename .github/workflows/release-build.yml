# Builds the Android APK signed with YOUR release key, for a version tag (v1.2.0) or by hand.
# It needs four repository secrets (see docs/RELEASING.md) and fails clearly without them, rather
# than producing a release signed with the public debug key. The APK is kept as a private workflow
# artifact; nothing is published.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  android-signed:
    name: Android - signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - name: Tests
        run: npm test -w app --if-present
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The secret ANDROID_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Assemble signed release APK
        working-directory: app/android
        env:
          SAFELINK_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          SAFELINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAFELINK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAFELINK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SAFELINK_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon -PrequireReleaseKey=true -Dorg.gradle.java.home="$JAVA_HOME"
      - name: Show who signed it
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          "$APKSIGNER" verify --print-certs app/android/app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/certs.txt"
          { echo "### Signing certificate"; echo '```'; grep "Signer #1 certificate" "$RUNNER_TEMP/certs.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safelink-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
